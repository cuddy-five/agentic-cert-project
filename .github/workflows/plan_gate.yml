# File: .github/workflows/plan_gate.yml
name: Plan Gate

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  require-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      has_template: ${{ steps.check.outputs.has_template }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Scope compares base.sha to head.sha. Depth 1 only has the merge commit.
          fetch-depth: 0
      - id: check
        name: Require plan artifact
        run: |
          if [ ! -f ".github/pull_request_template.md" ]; then
            echo "has_template=false" >> "$GITHUB_OUTPUT"
            echo ".github/pull_request_template.md is required for this pull request."
            echo "::error::Plan template is missing. Add a .github/pull_request_template.md"
            exit 1
          fi
          echo "has_template=true" >> "$GITHUB_OUTPUT"
          echo ".github/pull_request_template.md found."
      - name: Prove missing plan content fails
        run: bash .github/scripts/require-plan-headings.sh --self-test
      - name: Require plan headings and filled fields
        env:
          # Event payload already on the runner. Not an API call, secret, or extra service.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash .github/scripts/require-plan-headings.sh
      - name: Prove high-risk shell commands are denied
        run: bash .github/scripts/block-high-risk-command.sh --self-test
      - name: Prove a file outside Scope fails
        run: bash .github/scripts/require-scope-match.sh --self-test
      - name: Require changed files to stay inside Scope
        env:
          # Event payload already on the runner. The diff is git, not an API call.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/require-scope-match.sh
      - name: Show template flag
        run: echo "has_template is ${{ steps.check.outputs.has_template }}"
  read-flag:
    needs: require-plan
    runs-on: ubuntu-latest
    steps:
      - name: Use the published flag
        run: echo "other job sees ${{ needs.require-plan.outputs.has_template }}"
